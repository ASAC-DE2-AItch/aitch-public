# =============================================================================
# 용어 힌트 — S9 Copilot 답변용 (2026-08-11 신설 · 팀원 C)
# =============================================================================
# **쉬운 말 요약** — 챗봇이 "이 단어 무슨 뜻이야?" 에 답할 때 읽는 **한 줄 힌트 모음**이다.
#
# 🔴 **이 파일은 정본이 아니다.** 용어의 정본은 `CLAUDE.md`·`docs/` 이고, 여기는 그것을
#    대화창 길이로 줄여 놓은 **표시용 사본**이다. 그래서:
#      · 여기 문구를 근거로 결정하지 않는다. 판단이 필요하면 `ref` 가 가리키는 곳을 연다.
#      · 여기와 정본이 어긋나면 **정본이 이긴다.** 고칠 곳도 정본이다.
#      · 상세·근거·예외는 **일부러 안 적는다** — 적기 시작하면 정본이 둘이 된다.
#    (동기화 테스트를 걸지 않은 것도 같은 이유다. 계약이 아니라 힌트라서 CI 로 강제하지 않는다.)
#
# 스키마: term / aliases(표기 변형) / short(한 줄) / industry(현업 뜻이 다를 때만) / ref(정본 위치)
# 추가할 때: **한 줄을 넘기지 말 것.** 길어지면 그건 정본에 쓸 내용이다.
#
# ⚠️ **aliases 를 빠뜨리면 표기 하나만 잡힌다.** 실측: "Nelson Rule" 만 등재해서
#    "넬슨 룰이 뭐야" · "nelson 룰" 둘 다 미스였다. 사람은 음차·약칭·띄어쓰기를 섞어 쓴다.
#
# ⚠️ **센서 표시명(DC_Bias·RF_Vpp 등 25종)은 여기 적지 않는다.** 정본은
#    `config/sensor_map.yaml`(헌법 6-4)이고 `copilot.sensor_hits()` 가 거기서 직접 읽는다.
#    베끼면 표시명 정본이 둘이 된다.
# =============================================================================

terms:

  # --- 🔴 현업과 뜻이 갈리는 것 — 잘못 말하면 발표에서 바로 걸린다 ----------------
  - term: 실력치
    short: 우리 프로젝트에서는 관리 기준선(control limit)을 뜻한다.
    industry: 현업에서는 FDC 센서값 그 자체를 뜻한다 — 우리와 반대다.
    ref: CLAUDE.md 6-4

  - term: 스펙
    short: 현업 용어로 "센서값이 들어와야 하는 정상 범주" — 우리가 말하는 실력치가 이것이다.
    ref: CLAUDE.md 6-4

  - term: 관리 기준선
    short: 센서값의 정상 범위 상·하한. 코드·DB 에서는 control limit.
    ref: CLAUDE.md 1-1

  - term: 망대
    short: 상한만 관리하는 단측 항목.
    ref: CLAUDE.md 6-4
  - term: 망소
    short: 하한만 관리하는 단측 항목.
    ref: CLAUDE.md 6-4
  - term: 망목
    short: 중심 목표가 이상적인 가변 항목 — 조정 손잡이가 여기 속한다.
    ref: CLAUDE.md 6-4

  # --- 공정 기본 (화면 전반에 뜨는 말) -------------------------------------------
  - term: 레시피
    aliases: [recipe, 레시피가]
    short: 한 공정을 어떤 조건으로 돌릴지 적어 둔 설정표 — 가스량·온도·시간 같은 값의 묶음.
    ref: config/recipe_knob_map.yaml

  - term: 스텝
    short: 레시피 안의 단계. 우리 데이터는 step 4(메인 플라즈마)가 주 감시 구간이다.
    ref: docs/데이터_사전_v1.md

  - term: 챔버
    aliases: [chamber]
    short: 웨이퍼를 실제로 처리하는 방. 한 장비 안에 여러 개가 있고 각각 따로 관리한다.

  - term: 장비
    aliases: [tool, 설비]
    short: 챔버 여러 개를 묶은 설비 단위(tool). 공용 설비 문제는 장비 전체에 걸쳐 나타난다.

  - term: 웨이퍼
    aliases: [wafer, 웨하스]
    short: 처리 대상인 실리콘 원판 한 장. 판정·처분의 최소 단위다.
    ref: 계약 §3 wafer_id

  - term: PM
    aliases: [예방 정비, 정비, preventive maintenance]
    short: 예방 정비(Preventive Maintenance) — 챔버를 열어 청소·부품 교체를 하는 정기 작업.

  - term: C65
    aliases: [c65, 예측값, 예측 타겟]
    short: 우리가 예측하려는 품질 결과값(타겟). 센서가 아니라 결과라 조정 손잡이가 될 수 없다.
    ref: CLAUDE.md 1-3

  - term: 정착 구간
    short: 공정 조건이 안정된 뒤의 구간 — 판정·통계는 대개 여기 값만 쓴다.
  - term: 과도 구간
    short: 켜고 끄는 사이의 흔들리는 구간. 정상인데도 값이 튀어 판정에서 제외한다.

  # --- 판정·사건 -------------------------------------------------------------
  - term: Incident
    short: 같은 챔버에서 시간이 겹치는 알람들을 하나로 묶은 단위. 승인은 Incident 당 동시 1건.
    ref: CLAUDE.md 1-4

  - term: 4지선다
    short: Supervisor 판단 프레임 — 장비 이상 / 공정 조건 이탈 / 기준선 노후 / 그 밖(에스컬레이션).
    ref: CLAUDE.md 1-4

  - term: TTTM
    aliases: [tttm, 챔버 간 비교]
    short: 같은 장비의 다른 챔버들 평균 대비 이 챔버가 얼마나 벗어났나.
    ref: docs/API_Contract_명세서.md §3

  - term: reference_suspect
    short: 여러 챔버가 동시에 이탈 = 비교 기준 자체가 오염됐다는 신호(공용 설비 공통 원인 의심).
    ref: CLAUDE.md 1-1 예외 4

  - term: Nelson Rule
    aliases: [넬슨 룰, 넬슨룰, nelson, 넬슨]
    short: SPC 이상 판정 룰 N1~N8. 급변(N1)이냐 추세(N3·N5)냐가 판정을 가른다.
    ref: CLAUDE.md 1-1 예외 2

  # --- 조치 ------------------------------------------------------------------
  - term: R2R
    short: 이전 결과를 다음 런에 되먹여 보정하는 것. Recipe R2R 은 승인 필수, Model R2R 은 자동.
    ref: CLAUDE.md 1-1

  - term: 손잡이
    short: 레시피에서 사람이 값을 정해 넣는 조정 파라미터. knob_map 에 등재된 것만 유효하다.
    ref: config/recipe_knob_map.yaml · KB PK-TUNE-*

  - term: RTD
    # ⚠️ "인터락" 은 별칭에서 뺐다 (2026-08-11 실측) — 그건 **장비 인터락**(ERR-INTLK)이라는
    #   현업 용어지 우리 RTD 기능이 아니다. 별칭으로 두었더니 "인터락 걸리는 원인이 뭐야?"
    #   에 매뉴얼 대신 우리 기능 설명이 나갔다. 별칭은 **같은 것을 다르게 부르는 말**만.
    aliases: [rtd, 자동 정지, inhibit]
    short: 이상 감지 시 챔버를 자동으로 멈추는 안전 정지. 해제는 재인증 승인 하류만 가능하다.
    ref: CLAUDE.md 1-1 예외 4

  - term: Disposition
    aliases: [disposition, 처분, 스크랩, scrap, release, hold]
    short: wafer 처분 판정 — SCRAP(폐기) · HOLD(보류) · RELEASE(진행). 기본값은 HOLD.
    ref: docs/프론트_화면_정의서_v1.md S6

  - term: Qual
    aliases: [qual, 재인증, 큐얼]
    short: 정비(PM) 후 챔버를 다시 쓸 수 있는지 확인하는 재인증 판정. 결과는 조용 또는 요란.
    ref: docs/프론트_화면_정의서_v1.md S7

  - term: 요란 / 조용
    short: 정비 후 챔버 거동이 크게 달라졌나(요란) 그대로인가(조용). 요란이면 관리선을 새로 세운다.
    ref: CLAUDE.md 1-4

  # --- 모델 ------------------------------------------------------------------
  - term: CT
    aliases: [재학습, continuous training, ct1, ct2]
    short: 모델 자동 재학습. CT① = 예측 모델(일간), CT② = 이상탐지 AE(재인증 하류).
    ref: CLAUDE.md 3-3

  - term: champion-challenger
    short: 운영 중인 모델과 새 후보를 겨뤄 교체를 정하는 것. 통과 못 하면 배포하지 않는다.
    ref: CLAUDE.md 3-3

  - term: SHAP
    aliases: [shap, 섀플리, shap 분석]
    short: 예측값에 각 센서가 얼마나 기여했나 — 원인 축 후보를 좁히는 재료.
    ref: CLAUDE.md 3-3

  # --- 절차 ------------------------------------------------------------------
  - term: HITL
    aliases: [hitl, human in the loop, 사람 승인]
    short: 사람 승인을 반드시 거치게 하는 것. 레시피·실력치·정비·wafer 판정이 대상이다.
    ref: CLAUDE.md 1-1

  - term: 정기 리캘리브레이션
    short: 평상시에 최근 표본으로 관리선을 다시 계산하는 것. 상한 이내면 승인 없이 적용된다.
    ref: CLAUDE.md 1-1 예외

  - term: 섀도 평가
    short: 새 관리선을 실제 적용하지 않고 과거 데이터에 대보는 것 — 오탐이 줄었나, 미탐이 생겼나.
    ref: CLAUDE.md 1-1 예외 2

  - term: 오탐
    short: 정상인데 이상이라고 잡은 것. 너무 많으면 아무도 알람을 안 본다.
  - term: 미탐
    short: 이상인데 못 잡은 것. 오탐보다 위험해서, 미탐이 생기는 변경은 되돌린다.

  - term: 가한계
    short: >-
      요란 판정 후 정식 관리선을 세우기 전까지 임시로 쓰는 느슨한 한계선. 이 구간에서 모은
      데이터로 새 기준선을 만든다.
    ref: docs/프론트_화면_정의서_v1.md S7

  - term: 레짐
    short: 챔버의 거동 양상 자체. PM 등을 계기로 바뀌며, 바뀌면 과거 기준선이 안 맞는다.

  - term: 노후
    short: 장비는 그대로인데 관리선이 오래돼 현실과 안 맞는 상태 — 조치는 기준선 재설정이다.

  # --- 화면에서 보이는 말 -----------------------------------------------------
  - term: 승인 큐
    short: 사람 결정을 기다리는 조치 제안 목록. 여기서 승인·수정·반려한다.
    ref: docs/프론트_화면_정의서_v1.md S4

  - term: Brief
    aliases: [brief, 브리프, 요약 카드]
    short: Agent 가 만든 판단 요약 한 장 — 무슨 일인지, 왜 그렇게 봤는지, 뭘 하자는지.

  - term: 근거 카드
    short: 답·판정이 어디서 나왔는지 보여주는 출처 조각(유사 사례·매뉴얼·SPC 실측).

  - term: 컨텍스트 점수
    short: 알람이 얼마나 주목할 만한지 점수화한 값. 조사 순서를 정하는 데 쓴다.
    ref: 계약 §3 context_score

  - term: 마커
    short: 차트 위에 찍는 사건 표시(관리선 교체·정비 등). 값이 왜 달라졌는지 짚어준다.

  - term: 폴백
    short: 원래 경로가 실패했을 때 대신 내보내는 안전한 결과. 실패를 숨기지 않고 표시한다.

  - term: 드리프트
    aliases: [drift, 표류]
    short: 값이 갑자기가 아니라 조금씩 한 방향으로 밀려가는 것. 급변과 구분해서 다룬다.

  - term: 스코어카드
    short: 시뮬레이션 정답과 판정을 대조해 맞았나 틀렸나 채점한 표.

  # --- 단위 (차트·표에 그대로 뜬다) ---------------------------------------------
  - term: σ
    aliases: [sigma, 시그마]
    short: 표준편차 1개분. "3σ 벗어남" = 평소 흔들림의 3배만큼 떨어졌다는 뜻이다.
  - term: sccm
    short: 가스 유량 단위(분당 표준 cm³). 가스를 얼마나 흘리는지 나타낸다.
  - term: mTorr
    aliases: [torr]
    short: 압력 단위. 1 Torr 의 1/1000 로, 진공에 가까운 낮은 압력을 잰다.
  - term: Vdc
    short: DC 전압 단위. 플라즈마 셀프 바이어스(C11) 값이 이 단위다.
  - term: uptime
    aliases: [가동률]
    short: 그 챔버가 최근 창에서 실제로 돌아간 시간 비율.

  # --- 하드웨어·공정 (알람 문구·매뉴얼에 나온다) ----------------------------------
  - term: RF
    aliases: [rf power, rf 파워, 고주파]
    short: 플라즈마를 만드는 고주파 전력. 넣은 값(Set)·나간 값(Forward)·되돌아온 값(Reflect)을 따로 잰다.
  - term: 플라즈마
    aliases: [plasma]
    short: 가스에 고주파를 걸어 이온화시킨 상태. 식각이 실제로 일어나는 매질이다.
  - term: focus ring
    aliases: [포커스링, 포커스 링]
    short: 웨이퍼 가장자리를 둘러싼 소모성 부품. 닳으면 가장자리 식각이 틀어져 교체한다.
  - term: 척
    aliases: [chuck, esc, 정전척]
    short: 웨이퍼를 붙잡고 온도를 잡아주는 받침. He 로 뒷면을 식혀 온도를 유지한다.
  - term: 매칭
    aliases: [match, matcher, 매처]
    short: RF 전력이 반사되지 않고 잘 들어가도록 임피던스를 맞춰주는 장치.
  - term: 식각
    aliases: [etch, 에칭]
    short: 웨이퍼 표면을 깎아내는 공정. 우리가 감시하는 공정이 이것이다.

  # --- 모델 지표 ---------------------------------------------------------------
  - term: AE
    aliases: [autoencoder, 오토인코더, ae score, anomaly score, 이상 점수]
    short: 정상 데이터를 학습해 "평소와 얼마나 다른가"를 점수로 내는 이상탐지 모델.
  - term: RMSE
    aliases: [rmse]
    short: 예측이 실제와 평균적으로 얼마나 어긋났나. 작을수록 정확하다.
  - term: PSI
    aliases: [psi]
    short: 입력 데이터 분포가 학습 때와 얼마나 달라졌나. 서빙 보호 신호로 쓴다.
  - term: LOT
    aliases: [lot, 랏]
    short: 함께 처리되는 웨이퍼 묶음 단위.
